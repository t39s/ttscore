<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Team Live · ttScore Team</title>
  <link rel="stylesheet" href="./assets/0.13.0/live-viewer.css">
</head>
<body>
  <main id="team-live-viewer" class="viewer" data-state="loading">
    <header class="viewer__header">
      <p class="viewer__eyebrow">ttScore Team · постоянный Live</p>
      <h1 id="viewer-team-title" class="viewer__title">Командная встреча</h1>
      <p class="viewer__meta"><span id="viewer-pair"></span><span id="viewer-team-score"></span></p>
    </header>
    <section class="viewer__body">
      <div id="viewer-status" class="viewer__status" role="status" aria-live="polite">
        <h2 id="viewer-status-heading">Подключение к командной встрече…</h2>
        <p id="viewer-status-message">Проверяется актуальное назначение и публикация Live.</p>
      </div>
      <iframe id="viewer-frame" class="viewer__frame" src="about:blank" referrerpolicy="same-origin" hidden></iframe>
    </section>
    <p class="viewer__signature" aria-hidden="true">Постоянная ссылка · ttScore Team</p>
  </main>
  <script type="module" src="./assets/0.13.0/live-viewer-app.mjs"></script>
</body>
</html>
