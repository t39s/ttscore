<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Командная встреча · ttScore   Team</title>
  <style>
    :root {
      --background: #f4f5f7;
      --surface: #ffffff;
      --text: #111318;
      --muted: #626873;
      --line: #dfe2e7;
      --accent: #ffdd3c;
      --live: #138a3d;
      --live-soft: #e9f7ee;
      --finished: #e9edf2;
      --shadow: 0 10px 30px rgba(18, 24, 40, 0.08);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--background);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.45;
    }

    button, a { font: inherit; }

    .page {
      width: min(960px, 100%);
      margin: 0 auto;
      padding: max(24px, env(safe-area-inset-top)) 18px max(44px, env(safe-area-inset-bottom));
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 3.25rem);
      line-height: 1.05;
      letter-spacing: -0.035em;
    }

    .meta {
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .demo-label {
      display: inline-flex;
      margin-top: 18px;
      padding: 7px 11px;
      border-radius: 999px;
      background: var(--accent);
      font-size: 0.78rem;
      font-weight: 850;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .scoreboard {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      gap: 14px;
      align-items: stretch;
      margin-top: 28px;
    }

    .team {
      min-width: 0;
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .team--b { text-align: right; }

    .team__name {
      margin: 0;
      font-size: clamp(1.2rem, 3vw, 1.8rem);
      overflow-wrap: anywhere;
    }

    .team__players {
      margin: 14px 0 0;
      padding: 0;
      color: var(--muted);
      list-style: none;
    }

    .score {
      display: grid;
      place-items: center;
      min-width: 92px;
      padding: 10px;
      border-radius: 22px;
      background: #121317;
      color: #fff;
      font-size: clamp(2rem, 7vw, 4.4rem);
      font-weight: 900;
      letter-spacing: -0.08em;
    }

    .score__separator {
      margin: 0 0.12em;
      color: #8d929b;
    }

    .meeting-status {
      margin: 18px 0 0;
      padding: 14px 18px;
      border: 1px solid #b8dec4;
      border-radius: 16px;
      background: var(--live-soft);
      color: #0b6b2e;
      font-weight: 750;
    }

    .meeting-status--finished {
      border-color: var(--line);
      background: var(--finished);
      color: var(--text);
    }

    .section-heading {
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      margin: 36px 0 14px;
    }

    h2 {
      margin: 0;
      font-size: clamp(1.35rem, 4vw, 2rem);
      letter-spacing: -0.025em;
    }

    .refresh {
      min-height: 44px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-weight: 750;
    }

    .refresh:disabled { opacity: 0.55; }

    .matches { display: grid; gap: 10px; }

    .match {
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) minmax(150px, auto);
      gap: 16px;
      align-items: center;
      min-height: 88px;
      padding: 15px 17px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
    }

    .match--current {
      border-color: #7fc596;
      box-shadow: 0 0 0 3px rgba(19, 138, 61, 0.11);
    }

    .match--not_required { opacity: 0.62; }

    .match__order {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #eff1f4;
      font-weight: 900;
    }

    .match--current .match__order {
      background: var(--live);
      color: #fff;
    }

    .match__body { min-width: 0; }

    .match__players {
      display: flex;
      gap: 8px;
      align-items: baseline;
      font-weight: 800;
    }

    .match__player { overflow-wrap: anywhere; }
    .match__separator { color: var(--muted); }

    .status {
      display: inline-block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 700;
    }

    .status--current { color: var(--live); }

    .match__result {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: flex-end;
      text-align: right;
    }

    .result-score {
      min-width: 50px;
      font-size: 1.35rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 11px;
      text-decoration: none;
      font-weight: 800;
    }

    .button--live { background: var(--live); color: #fff; }
    .button--secondary { background: #17181c; color: #fff; }
    .muted { color: var(--muted); font-size: 0.9rem; }

    .updated {
      margin: 16px 2px 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .public-note {
      margin: 28px 0 0;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.84rem;
    }

    .notice {
      margin-top: 24px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--surface);
    }

    .notice strong, .notice span { display: block; }
    .notice span { margin-top: 5px; color: var(--muted); overflow-wrap: anywhere; }
    .notice--error { border-color: #dc9a9a; background: #fff3f3; }

    [hidden] { display: none !important; }

    @media (max-width: 680px) {
      .page { padding-inline: 12px; }
      .scoreboard { grid-template-columns: 1fr 78px 1fr; gap: 8px; }
      .team { padding: 16px 12px; border-radius: 18px; }
      .team__players { font-size: 0.86rem; }
      .score { min-width: 0; padding: 8px 4px; border-radius: 18px; }
      .match { grid-template-columns: 44px minmax(0, 1fr); gap: 10px; }
      .match__result { grid-column: 2; justify-content: flex-start; text-align: left; }
      .match__players { display: grid; gap: 1px; }
      .match__separator { display: none; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header>
      <p class="eyebrow">ttScore Team · v0.1.1</p>
      <h1 id="meeting-title">Командная встреча</h1>
      <p id="meeting-meta" class="meta"></p>
      <span class="demo-label">Вымышленные данные · прототип</span>
    </header>

    <div id="loading" class="notice" role="status">
      <strong>Загрузка командной встречи…</strong>
    </div>

    <div id="error" class="notice notice--error" role="alert" hidden>
      <strong></strong>
      <span></span>
    </div>

    <div id="content" hidden>
      <section class="scoreboard" aria-label="Командный счёт">
        <article class="team">
          <h2 id="team-a-name" class="team__name"></h2>
          <ul id="team-a-players" class="team__players"></ul>
        </article>
        <div class="score" aria-label="Счёт">
          <span><span id="team-a-score">0</span><span class="score__separator">:</span><span id="team-b-score">0</span></span>
        </div>
        <article class="team team--b">
          <h2 id="team-b-name" class="team__name"></h2>
          <ul id="team-b-players" class="team__players"></ul>
        </article>
      </section>

      <p id="meeting-status" class="meeting-status" role="status"></p>

      <section aria-labelledby="schedule-heading">
        <div class="section-heading">
          <h2 id="schedule-heading">Личные встречи</h2>
          <button id="refresh" class="refresh" type="button">Обновить</button>
        </div>
        <div id="matches" class="matches"></div>
        <p id="updated" class="updated"></p>
      </section>

      <p class="public-note">Составы, результаты, live-ссылки и JSON-отчёты этой встречи опубликованы открыто.</p>
    </div>
  </main>

  <script type="module" src="./app.mjs"></script>
</body>
</html>
