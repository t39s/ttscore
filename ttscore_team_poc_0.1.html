const ROOT_SCHEMAS = Object.freeze({

    'schemaVersion', 'projectionProtocolVersion', 'roomId', 'adminEpoch',

    'assignmentRevision', 'teamRevision', 'positionNumber', 'leftTeam',

    'serverSide', 'status', 'lastActionId', 'lastActionAt',
  ],
  transferCheckpoint: [
    'schemaVersion', 'roomId', 'individualMeetingId', 'assignmentRevision',
    'controlEpoch', 'activeSessionId', 'checkpointRevision',
    'recordRevision', 'matchState', 'completedGames', 'actionJournal',
    'undoBoundaryRevision', 'individualReportData', 'createdAt',
  ],
  pendingFinalResult: [
    'schemaVersion', 'roomId', 'teamMeetingId', 'individualMeetingId',
    'assignmentRevision', 'submissionId', 'supersedesSubmissionId',
    'controlEpoch', 'activeSessionId', 'recordRevision', 'positionNumber',

    'individualReportData', 'createdAt',
  ],
  teamProjection: [
    'schemaVersion', 'projectionProtocolVersion', 'roomId', 'teamMeetingId',
    'adminEpoch', 'activeAdminSessionId', 'teamRevision',
    'currentIndividualMeetingId', 'assignmentRevision', 'leftTeam',
    'rightTeam', 'teamScoreLeft', 'teamScoreRight', 'positions',
    'publicStatus', 'updatedAt',
  ],
  adminRecoverySnapshot: [
    'schemaVersion', 'roomId', 'teamMeetingId', 'adminEpoch',
    'activeAdminSessionId', 'teamRevision', 'canonicalTeamState',
    'acceptedIndividualMeetingIds', 'administrativeEvents',
    'channelSecrets', 'createdAt',
  ],
});

function bytesToBase64Url(bytes) {
  let binary = '';
  for (const byte of bytes) binary += String.fromCharCode(byte);
  const base64 = typeof btoa === 'function'
    ? btoa(binary)
    : Buffer.from(binary, 'binary').toString('base64');
  return base64.replaceAll('+', '-').replaceAll('/', '_').replace(/=+$/u, '');
}

function base64UrlToBytes(value) {
  if (typeof value !== 'string' || !/^[A-Za-z0-9_-]+$/u.test(value)) {
    throw new Error('invalid_base64url');
  }
  const padded = value.replaceAll('-', '+').replaceAll('_', '/')
    + '='.repeat((4 - (value.length % 4)) % 4);
  const binary = typeof atob === 'function'
    ? atob(padded)
    : Buffer.from(padded, 'base64').toString('binary');
  return Uint8Array.from(binary, (char) => char.charCodeAt(0));
}

function randomId(byteLength = 16, cryptoApi = globalThis.crypto) {
  const bytes = new Uint8Array(byteLength);
  cryptoApi.getRandomValues(bytes);
  return bytesToBase64Url(bytes);
}

function generateKey(cryptoApi = globalThis.crypto) {
  return randomId(16, cryptoApi);
}

function aadString({ roomId, payloadType, primaryRevision, securityEpoch }) {
  return `ttscore|${roomId}|${payloadType}|1|${primaryRevision}|${securityEpoch}`;
}

async function importAesKey(keyBase64Url, usage, cryptoApi = globalThis.crypto) {
  const raw = base64UrlToBytes(keyBase64Url);
  if (raw.byteLength !== 16) throw new Error('invalid_key_length');
  return cryptoApi.subtle.importKey('raw', raw, { name: 'AES-GCM' }, false, usage);
}

async function encryptJson(keyBase64Url, payload, aad, cryptoApi = globalThis.crypto) {
  const key = await importAesKey(keyBase64Url, ['encrypt'], cryptoApi);
  const nonce = new Uint8Array(12);
  cryptoApi.getRandomValues(nonce);
  const nonceId = `${keyBase64Url}:${bytesToBase64Url(nonce)}`;
  if (usedNonces.has(nonceId)) throw new Error('nonce_reuse_detected');
  usedNonces.add(nonceId);
  const ciphertext = await cryptoApi.subtle.encrypt(
    { name: 'AES-GCM', iv: nonce, additionalData: te.encode(aad), tagLength: 128 },
    key,
    te.encode(JSON.stringify(payload)),
  );
  return {
    ciphertext: bytesToBase64Url(new Uint8Array(ciphertext)),
    nonce: bytesToBase64Url(nonce),
  };
}

async function decryptJson(keyBase64Url, envelope, aad, cryptoApi = globalThis.crypto) {
  const key = await importAesKey(keyBase64Url, ['decrypt'], cryptoApi);
  const nonce = base64UrlToBytes(envelope.nonce);
  if (nonce.byteLength !== 12) throw new Error('invalid_nonce_length');
  const clear = await cryptoApi.subtle.decrypt(
    { name: 'AES-GCM', iv: nonce, additionalData: te.encode(aad), tagLength: 128 },
    key,
    base64UrlToBytes(envelope.ciphertext),
  );
  return JSON.parse(td.decode(clear));
}

function validatePayload(type, payload) {
  const expected = ROOT_SCHEMAS[type];
  if (!expected) throw new Error(`unknown_payload_type:${type}`);
  if (!payload || typeof payload !== 'object' || Array.isArray(payload)) {
    throw new Error(`${type}:not_object`);
  }
  if (payload.schemaVersion !== 1) throw new Error(`${type}:schema_version`);
  const actual = Object.keys(payload).sort();
  const wanted = [...expected].sort();
  if (actual.length !== wanted.length || actual.some((key, i) => key !== wanted[i])) {
    throw new Error(`${type}:root_fields`);
  }
  if (!/^[A-Za-z0-9_-]{22,64}$/u.test(payload.roomId)) {
    throw new Error(`${type}:room_id`);
  }
  if (type === 'individualState') {
    if (!['left', 'right', null].includes(payload.serverSide)) throw new Error('individualState:server');
    if (['game_finished', 'pending_confirmation', 'finished'].includes(payload.status)
      && payload.serverSide !== null) throw new Error('individualState:finished_server');
  }
  if (type === 'pendingFinalResult') {
    const { finalGamesLeft: left, finalGamesRight: right } = payload;
    if (!((left === 3 && right >= 0 && right <= 2) || (right === 3 && left >= 0 && left <= 2))) {
      throw new Error('pendingFinalResult:games');
    }
    if (payload.winnerSide !== (left === 3 ? 'left' : 'right')) {
      throw new Error('pendingFinalResult:winner');
    }
  }
  return payload;
}

function buildLinks(baseUrl, roomId, publicViewKey, judgeTransferKey) {
  const base = new URL(baseUrl);
  base.search = '';
  base.hash = '';
  const judge = new URL(base);
  judge.searchParams.set('mode', 'team-judge');
  judge.searchParams.set('room', roomId);
  judge.hash = `k=${judgeTransferKey}`;
  const viewer = new URL(base);
  viewer.searchParams.set('mode', 'team-live');
  viewer.searchParams.set('room', roomId);
  viewer.hash = `k=${publicViewKey}`;
  return { judge: judge.href, viewer: viewer.href };
}

function validGameScore(left, right) {
  return (left >= 11 || right >= 11) && Math.abs(left - right) >= 2;
}

function serverFor(firstServerSide, displayedGameNumber, pointsLeft, pointsRight) {
  const opening = displayedGameNumber % 2 === 1
    ? firstServerSide
    : (firstServerSide === 'left' ? 'right' : 'left');
  const total = pointsLeft + pointsRight;
  const switches = total < 20 ? Math.floor(total / 2) : 10 + (total - 20);
  return switches % 2 === 0 ? opening : (opening === 'left' ? 'right' : 'left');
}

function createMatchState({ leftPlayer, rightPlayer, firstServerSide = 'left', startedAt = Date.now() }) {
  return {
    leftPlayer,
    rightPlayer,
    firstServerSide,
    displayedGameNumber: 1,
    pointsLeft: 0,
    pointsRight: 0,
    gamesBeforeDisplayedLeft: 0,
    gamesBeforeDisplayedRight: 0,
    completedGames: [],
    serverSide: firstServerSide,
    status: 'ready',
    recordRevision: 1,
    lastActionId: randomId(12),
    lastActionAt: startedAt,
    startedAt,
    undoStack: [],
  };
}

function scoreSnapshot(state) {
  const copy = structuredClone(state);
  copy.undoStack = [];
  return copy;
}

function addPoint(state, side, at = Date.now()) {
  if (!['left', 'right'].includes(side)) throw new Error('invalid_side');
  if (['game_finished', 'finished', 'pending_confirmation'].includes(state.status)) {
    throw new Error('score_locked');
  }
  const next = structuredClone(state);
  next.undoStack.push(scoreSnapshot(state));
  if (side === 'left') next.pointsLeft += 1;
  else next.pointsRight += 1;
  next.recordRevision += 1;
  next.lastActionId = randomId(12);
  next.lastActionAt = at;
  next.status = 'in_progress';
  if (validGameScore(next.pointsLeft, next.pointsRight)) {
    const winnerSide = next.pointsLeft > next.pointsRight ? 'left' : 'right';
    next.completedGames.push({
      gameNumber: next.displayedGameNumber,
      leftPoints: next.pointsLeft,
      rightPoints: next.pointsRight,
      winnerSide,
    });
    const winsLeft = next.gamesBeforeDisplayedLeft + (winnerSide === 'left' ? 1 : 0);
    const winsRight = next.gamesBeforeDisplayedRight + (winnerSide === 'right' ? 1 : 0);
    next.serverSide = null;
    next.status = winsLeft === 3 || winsRight === 3 ? 'finished' : 'game_finished';
  } else {
    next.serverSide = serverFor(
      next.firstServerSide,
      next.displayedGameNumber,
      next.pointsLeft,
      next.pointsRight,
    );
  }
  return next;
}

function startNextGame(state, at = Date.now()) {
  if (state.status !== 'game_finished') throw new Error('game_not_finished');
  const last = state.completedGames.at(-1);
  const next = structuredClone(state);
  next.undoStack.push(scoreSnapshot(state));
  next.gamesBeforeDisplayedLeft += last.winnerSide === 'left' ? 1 : 0;
  next.gamesBeforeDisplayedRight += last.winnerSide === 'right' ? 1 : 0;
  next.displayedGameNumber += 1;
  next.pointsLeft = 0;
  next.pointsRight = 0;
  next.recordRevision += 1;
  next.lastActionId = randomId(12);
  next.lastActionAt = at;
  next.status = 'ready';
  next.serverSide = serverFor(next.firstServerSide, next.displayedGameNumber, 0, 0);
  return next;
}

function undo(state, at = Date.now()) {
  if (!state.undoStack.length) throw new Error('nothing_to_undo');
  const next = structuredClone(state.undoStack.at(-1));
  next.undoStack = state.undoStack.slice(0, -1);
  next.recordRevision = state.recordRevision + 1;
  next.lastActionId = randomId(12);
  next.lastActionAt = at;
  return next;
}

function gamesIncludingDisplayed(state) {
  if (!['game_finished', 'finished'].includes(state.status)) {
    return [state.gamesBeforeDisplayedLeft, state.gamesBeforeDisplayedRight];
  }
  const last = state.completedGames.at(-1);
  return [
    state.gamesBeforeDisplayedLeft + (last.winnerSide === 'left' ? 1 : 0),
    state.gamesBeforeDisplayedRight + (last.winnerSide === 'right' ? 1 : 0),
  ];
}

function compatibleProjectionPair(teamProjectionEnvelope, individualStateEnvelope) {
  if (!teamProjectionEnvelope || !individualStateEnvelope) return false;
  return teamProjectionEnvelope.currentIndividualMeetingId === individualStateEnvelope.individualMeetingId
    && teamProjectionEnvelope.assignmentRevision === individualStateEnvelope.assignmentRevision
    && teamProjectionEnvelope.projectionProtocolVersion === individualStateEnvelope.projectionProtocolVersion;
}

function openLocalDb() {
  return new Promise((resolve, reject) => {
    const request = indexedDB.open('ttscore-team-meeting-poc-v1', 1);
    request.onupgradeneeded = () => request.result.createObjectStore('records');
    request.onsuccess = () => resolve(request.result);
    request.onerror = () => reject(request.error);
  });
}

async function idbPut(key, value) {
  const localDb = await openLocalDb();
  return new Promise((resolve, reject) => {
    const tx = localDb.transaction('records', 'readwrite');
    tx.objectStore('records').put(value, key);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}

async function idbGet(key) {
  const localDb = await openLocalDb();
  return new Promise((resolve, reject) => {
    const request = localDb.transaction('records').objectStore('records').get(key);
    request.onsuccess = () => resolve(request.result || null);
    request.onerror = () => reject(request.error);
  });
}

  const current = state.currentPositionNumber
    ? state.positions[state.currentPositionNumber - 1]
    : null;
  return {
    schemaVersion: SCHEMA_VERSION,
    projectionProtocolVersion: PROJECTION_PROTOCOL_VERSION,
    roomId: state.roomId,
    teamMeetingId: state.teamMeetingId,
    adminEpoch,
    activeAdminSessionId: adminSessionId,
    teamRevision: state.teamRevision,
    currentIndividualMeetingId: current?.individualMeetingId || null,
    assignmentRevision: current?.assignmentRevision || null,
    leftTeam: state.leftTeam,
    rightTeam: state.rightTeam,
    teamScoreLeft: state.teamScoreLeft,
    teamScoreRight: state.teamScoreRight,
    positions: state.positions.map(publicPosition),
    publicStatus,
    updatedAt: Date.now(),
  };
}

function recoveryPayload(state, adminEpoch, adminSessionId, secrets) {
  return {
    schemaVersion: SCHEMA_VERSION,
    roomId: state.roomId,
    teamMeetingId: state.teamMeetingId,
    adminEpoch,
    activeAdminSessionId: adminSessionId,
    teamRevision: state.teamRevision,
    canonicalTeamState: state,
    acceptedIndividualMeetingIds: state.acceptedIndividualMeetingIds,
    administrativeEvents: state.administrativeEvents,
    channelSecrets: {
      publicViewKey: secrets.publicViewKey,
      judgeTransferKey: secrets.judgeTransferKey,
    },
    createdAt: Date.now(),
  };
}

async function encryptedEnvelope(type, key, payload, primaryRevision, securityEpoch, open) {
  validatePayload(type, payload);
  const aad = aadString({ roomId: payload.roomId, payloadType: type, primaryRevision, securityEpoch });
  const encrypted = await encryptJson(key, payload, aad);
  return { ...open, ...encrypted, updatedAt: Date.now() };
}

async function createProjectionEnvelope(state, control, secrets) {
  const payload = projectionPayload(state, control.adminEpoch, control.activeAdminSessionId);
  return encryptedEnvelope('teamProjection', secrets.publicViewKey, payload, state.teamRevision, control.adminEpoch, {
    schemaVersion: 1,
    projectionProtocolVersion: 1,
    adminEpoch: control.adminEpoch,
    activeAdminSessionId: control.activeAdminSessionId,
    ...(payload.currentIndividualMeetingId ? {
      currentIndividualMeetingId: payload.currentIndividualMeetingId,
      assignmentRevision: payload.assignmentRevision,
    } : {}),
    teamRevision: state.teamRevision,
  });
}

async function createRecoveryEnvelope(state, control, secrets) {
  const payload = recoveryPayload(state, control.adminEpoch, control.activeAdminSessionId, secrets);
  return encryptedEnvelope('adminRecoverySnapshot', secrets.adminRecoveryKey, payload, state.teamRevision, control.adminEpoch, {
    schemaVersion: 1,
    adminEpoch: control.adminEpoch,
    activeAdminSessionId: control.activeAdminSessionId,
    teamRevision: state.teamRevision,
  });
}

async function isGlobalAdmin(uid) {
  const snapshot = await get(ref(db, `/access/admins/${uid}`));
  return snapshot.val() === true;
}

async function createRoom() {
  if (!user || !(await isGlobalAdmin(user.uid))) throw new Error('global_admin_required');
  const roomId = randomId(16);
  const adminSessionId = randomId(12);
  const secrets = {
    publicViewKey: generateKey(),
    judgeTransferKey: generateKey(),
    adminRecoveryKey: generateKey(),
  };
  const canonical = createCanonical(roomId, adminSessionId);
  const adminControl = {
    state: 'active', adminEpoch: 1, activeAdminUid: user.uid,
    activeAdminSessionId: adminSessionId, sessionCommittedAt: Date.now(),
  };
  const [projection, recovery] = await Promise.all([
    createProjectionEnvelope(canonical, adminControl, secrets),
    createRecoveryEnvelope(canonical, adminControl, secrets),
  ]);
  await idbPut(`admin:${roomId}`, { canonical, outbox: null });
  saveSecrets(roomId, secrets);
  const value = {
    ownerUid: user.uid,
    adminControl,
    control: { state: 'idle', controlEpoch: 1 },
    public: { meta: { schemaVersion: 1, status: 'prepared' }, teamProjection: projection },
    adminRecoverySnapshot: recovery,
  };
  await set(ref(db, `/teamRooms/${roomId}`), value);
  localStorage.setItem('ttscore:poc:current-admin-room', roomId);
  await downloadRecovery(roomId, secrets.adminRecoveryKey);
  log('room_created', { roomId });
  await renderAdminRoom(roomId);
}

async function downloadRecovery(roomId, adminRecoveryKey) {
  const checksumInput = new TextEncoder().encode(`ttscore|${roomId}|${adminRecoveryKey}|1`);
  const checksum = bytesToBase64Url(new Uint8Array(await crypto.subtle.digest('SHA-256', checksumInput)));
  const payload = JSON.stringify({ schemaVersion: 1, roomId, adminRecoveryKey, checksum }, null, 2);
  const blob = new Blob([payload], { type: 'application/json' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `ttScore_recovery_${roomId}.json`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

async function adminRoomContext(roomId) {
  let local = await idbGet(`admin:${roomId}`);
  if (!local) throw new Error('local_admin_state_not_found');
  if (online && local.outbox) {
    await update(ref(db, `/teamRooms/${roomId}`), local.outbox);
    local = { canonical: local.canonical, outbox: null };
    await idbPut(`admin:${roomId}`, local);
    log('admin_outbox_replayed', { roomId, teamRevision: local.canonical.teamRevision });
  }
  const secrets = loadSecrets(roomId);
  const room = (await get(ref(db, `/teamRooms/${roomId}`))).val();
  if (!room) throw new Error('room_not_found');
  return { local, secrets, room };
}

function clearSubscriptions() {
  while (unsubscribers.length) unsubscribers.pop()?.();
}

function subscribeAdmin(roomId) {
  clearSubscriptions();
  unsubscribers.push(onValue(ref(db, `/teamRooms/${roomId}/accessRequests`), (snapshot) => {
    const box = document.querySelector('#accessRequests');
    if (!box) return;
    const requests = snapshot.val() || {};
    box.innerHTML = '';
    for (const [uid, request] of Object.entries(requests)) {
      const row = document.createElement('div'); row.className = 'request';
      row.innerHTML = `<strong>${escapeHtml(request.requestedEmail)}</strong><span class="mono">${escapeHtml(uid)}</span>`;
      row.append(button('Разрешить', () => grantJudge(roomId, uid)));
      box.append(row);
    }
    if (!box.children.length) box.textContent = 'Нет запросов';
  }, (error) => log('admin_requests_listener_error', { error: safeError(error), roomId })));
  unsubscribers.push(onValue(ref(db, `/teamRooms/${roomId}/inbox`), (snapshot) => {
    const box = document.querySelector('#pendingResults');
    if (!box) return;
    const inbox = snapshot.val() || {};
    box.innerHTML = '';
    for (const [meetingId, result] of Object.entries(inbox)) {
      if (result.status !== 'pending') continue;
      const row = document.createElement('div'); row.className = 'result';
      row.innerHTML = `<strong>Результат ожидает принятия</strong><span class="mono">${escapeHtml(meetingId)}</span>`;
      row.append(button('Принять результат', () => acceptResult(roomId, meetingId)));
      box.append(row);
    }
    if (!box.children.length) box.textContent = 'Нет результатов';
  }, (error) => log('admin_inbox_listener_error', { error: safeError(error), roomId })));
}

async function grantJudge(roomId, judgeUid) {
  const room = (await get(ref(db, `/teamRooms/${roomId}`))).val();
  const now = Date.now();

async function publishAssignment(roomId) {
  const { local, secrets, room } = await adminRoomContext(roomId);
  if (local.canonical.teamScoreLeft === 3 || local.canonical.teamScoreRight === 3) throw new Error('team_meeting_finished');
  if (room.inbox && Object.values(room.inbox).some((item) => item.status === 'pending')) throw new Error('pending_result_must_be_accepted');
  const positionNumber = local.canonical.acceptedIndividualMeetingIds.length + 1;
  if (positionNumber > 5) throw new Error('position_limit');
  const leftPlayer = player(document.querySelector('#leftFamily').value);
  const rightPlayer = player(document.querySelector('#rightFamily').value);
  if (!leftPlayer.familyName || !rightPlayer.familyName) throw new Error('family_name_required');
  const state = structuredClone(local.canonical);
  state.teamRevision += 1;
  state.assignmentRevision = (state.assignmentRevision || 0) + 1;
  state.currentPositionNumber = positionNumber;
  state.status = 'active';
  const meetingId = state.positions[positionNumber - 1].individualMeetingId;
  state.positions[positionNumber - 1] = {
    ...state.positions[positionNumber - 1], assignmentRevision: state.assignmentRevision,
    leftPlayer, rightPlayer, status: 'confirmed',
  };
  state.administrativeEvents.push({
    eventId: randomId(12), commandId: randomId(12), type: 'assignment_confirmed',
    teamRevision: state.teamRevision, adminEpoch: room.adminControl.adminEpoch,
    activeAdminSessionId: room.adminControl.activeAdminSessionId,
    positionNumber, individualMeetingId: meetingId, reasonCode: null,
    details: null, createdAt: Date.now(),
  });
  const assignmentPayload = {
    schemaVersion: 1, projectionProtocolVersion: 1, roomId,
    adminEpoch: room.adminControl.adminEpoch,
    activeAdminSessionId: room.adminControl.activeAdminSessionId,
    teamMeetingId: state.teamMeetingId, individualMeetingId: meetingId,
    assignmentRevision: state.assignmentRevision, teamRevision: state.teamRevision,
    positionNumber, leftTeam: state.leftTeam, rightTeam: state.rightTeam,
    leftPlayer, rightPlayer, rules: { gamesToWin: 3, gameTargetPoints: 11, winBy: 2 },
    handicap: makeHandicap(), publicViewKey: secrets.publicViewKey, createdAt: Date.now(),
  };
  const assignment = await encryptedEnvelope(
    'assignment', secrets.judgeTransferKey, assignmentPayload,
    state.assignmentRevision, room.adminControl.adminEpoch,
    {
      schemaVersion: 1, projectionProtocolVersion: 1,
      adminEpoch: room.adminControl.adminEpoch,
      activeAdminSessionId: room.adminControl.activeAdminSessionId,
      individualMeetingId: meetingId, assignmentRevision: state.assignmentRevision,
      teamRevision: state.teamRevision,
    },
  );
  const [projection, recovery] = await Promise.all([
    createProjectionEnvelope(state, room.adminControl, secrets),
    createRecoveryEnvelope(state, room.adminControl, secrets),
  ]);
  const patch = {
    assignment,
    'public/teamProjection': projection,
    ...individualStateRemovalPatch(room),
    adminRecoverySnapshot: recovery,
    'public/meta': { schemaVersion: 1, status: 'active' },
  };
  await idbPut(`admin:${roomId}`, { canonical: state, outbox: patch });
  await update(ref(db, `/teamRooms/${roomId}`), patch);
  await idbPut(`admin:${roomId}`, { canonical: state, outbox: null });
  log('assignment_published', { roomId, meetingId, positionNumber, teamRevision: state.teamRevision });
  await renderAdminRoom(roomId);
}

async function acceptResult(roomId, meetingId) {
  const { local, secrets, room } = await adminRoomContext(roomId);
  const pending = room.inbox?.[meetingId];
  if (!pending || pending.status !== 'pending') throw new Error('pending_result_not_found');
  const aad = aadString({ roomId, payloadType: 'pendingFinalResult', primaryRevision: pending.recordRevision, securityEpoch: pending.controlEpoch });
  const result = validatePayload('pendingFinalResult', await decryptJson(secrets.judgeTransferKey, pending, aad));
  const state = structuredClone(local.canonical);
  if (state.acceptedIndividualMeetingIds.includes(meetingId)) throw new Error('result_already_accepted');
  state.teamRevision += 1;
  state.acceptedIndividualMeetingIds.push(meetingId);
  state.individualReports.push(result.individualReportData);
  state.teamScoreLeft += result.winnerSide === 'left' ? 1 : 0;
  state.teamScoreRight += result.winnerSide === 'right' ? 1 : 0;
  const position = state.positions[result.positionNumber - 1];
  Object.assign(position, {
    status: 'finished', winnerSide: result.winnerSide,
    finalGamesLeft: result.finalGamesLeft, finalGamesRight: result.finalGamesRight,
    resultStatus: 'played', acceptedSubmissionId: result.submissionId,
  });
  const finished = state.teamScoreLeft === 3 || state.teamScoreRight === 3;
  state.status = finished ? 'finished' : 'active';
  if (finished) {
    for (const pendingPosition of state.positions.slice(result.positionNumber)) {
      if (['planned', 'preassigned', 'confirmed'].includes(pendingPosition.status)) {
        pendingPosition.statusBeforeEarlyFinish = pendingPosition.status;
        pendingPosition.status = 'not_required';
        pendingPosition.resultStatus = 'not_required';
      }
    }
  }
  state.administrativeEvents.push({
    eventId: randomId(12), commandId: randomId(12), type: 'result_accepted',
    teamRevision: state.teamRevision, adminEpoch: room.adminControl.adminEpoch,
    activeAdminSessionId: room.adminControl.activeAdminSessionId,
    positionNumber: result.positionNumber, individualMeetingId: meetingId,
    reasonCode: null, details: null, createdAt: Date.now(),
  });
  const [projection, recovery] = await Promise.all([
    createProjectionEnvelope(state, room.adminControl, secrets),
    createRecoveryEnvelope(state, room.adminControl, secrets),
  ]);
  const accepted = {
    schemaVersion: 1, submissionId: pending.submissionId,
    submittedBy: pending.submittedBy, status: 'accepted',
    submittedAt: pending.submittedAt, acceptedTeamRevision: state.teamRevision,
    acceptedAdminEpoch: room.adminControl.adminEpoch,
    acceptedAdminSessionId: room.adminControl.activeAdminSessionId,
    processedAt: Date.now(),
  };
  const patch = {
    [`inbox/${meetingId}`]: accepted,
    'public/teamProjection': projection,
    adminRecoverySnapshot: recovery,
    ...(finished ? { 'public/meta': { schemaVersion: 1, status: 'finished', expiresAt: Date.now() + THIRTY_DAYS_MS } } : {}),
  };
  await idbPut(`admin:${roomId}`, { canonical: state, outbox: patch });
  await update(ref(db, `/teamRooms/${roomId}`), patch);
  await idbPut(`admin:${roomId}`, { canonical: state, outbox: null });
  log('result_accepted', { roomId, meetingId, teamRevision: state.teamRevision, finished });
  if (finished) exportTeamReport(state);
  await renderAdminRoom(roomId);
}

function exportTeamReport(state) {
  const rows = state.positions.map((position) => `<tr><td>${position.positionNumber}</td><td>${escapeHtml(position.leftPlayer?.familyName || '—')}</td><td>${escapeHtml(position.rightPlayer?.familyName || '—')}</td><td>${escapeHtml(position.status)}</td><td>${position.finalGamesLeft ?? '—'}:${position.finalGamesRight ?? '—'}</td></tr>`).join('');
  const html = `<!doctype html><html lang="ru"><meta charset="utf-8"><title>ttScore — итог</title><body><h1>${escapeHtml(state.leftTeam.name)} — ${escapeHtml(state.rightTeam.name)}</h1><h2>${state.teamScoreLeft}:${state.teamScoreRight}</h2><table border="1" cellspacing="0" cellpadding="8"><tr><th>№</th><th>Слева</th><th>Справа</th><th>Статус</th><th>Партии</th></tr>${rows}</table><p>Автономный отчёт · ttScore Team Meeting PoC v0.1</p></body></html>`;
  const blob = new Blob([html], { type: 'text/html' });
  const link = document.createElement('a');
  link.href = URL.createObjectURL(blob);
  link.download = `ttScore_team_report_${state.roomId}.html`;
  link.click();
  setTimeout(() => URL.revokeObjectURL(link.href), 1000);
}

async function requestJudgeAccess(roomId) {
  await set(ref(db, `/teamRooms/${roomId}/accessRequests/${user.uid}`), {
    requestedEmail: user.email || `${user.uid}@emulator.test`, requestedAt: Date.now(), status: 'pending',
  });
  log('judge_access_requested', { roomId, judgeUid: user.uid });
}

function subscribeJudge(roomId, judgeKey) {
  clearSubscriptions();
  unsubscribers.push(onValue(ref(db, `/teamRooms/${roomId}/judgeAccess/${user.uid}`), (snapshot) => {
    const access = snapshot.val();
    const node = document.querySelector('#judgeAccessStatus');
    if (node) node.textContent = access?.granted && !access.revokedAt ? 'Допуск действует' : 'Ожидается допуск администратора';
  }, (error) => log('judge_access_listener_error', { roomId, error: safeError(error) })));
  unsubscribers.push(onValue(ref(db, `/teamRooms/${roomId}/assignment`), async (snapshot) => {
    const envelope = snapshot.val();
    if (!envelope) return;
    try {
      const aad = aadString({ roomId, payloadType: 'assignment', primaryRevision: envelope.assignmentRevision, securityEpoch: envelope.adminEpoch });
      const payload = validatePayload('assignment', await decryptJson(judgeKey, envelope, aad));
      sessionStorage.setItem(`ttscore:poc:public-key:${roomId}`, payload.publicViewKey);
      await idbPut(`judge:assignment:${roomId}`, payload);
      await renderJudgeMatch(roomId, payload);
    } catch (error) { log('assignment_decrypt_error', { roomId, error: safeError(error) }); }
  }, (error) => log('assignment_listener_error', { roomId, error: safeError(error) })));
  unsubscribers.push(onValue(ref(db, `/teamRooms/${roomId}/public/meta`), (snapshot) => {
    if (snapshot.val()?.status === 'finished') {
      document.querySelectorAll('#judgeMatch button').forEach((node) => { node.disabled = true; });
      log('judge_read_only_finished', { roomId });
    }
  }));
}

async function acquireControl(roomId) {
  const controlRef = ref(db, `/teamRooms/${roomId}/control`);
  const control = (await get(controlRef)).val();
  if (!control) throw new Error('control_not_found');
  if (control.state === 'active' && control.activeJudgeUid === user.uid) {
    await renewControl(roomId);
    return;
  }
  if (control.state !== 'idle') throw new Error('table_control_busy');
  const now = Date.now();
  const active = {
    state: 'active', controlEpoch: control.controlEpoch,
    activeJudgeUid: user.uid, activeSessionId: randomId(12),
    sessionCommittedAt: now, heartbeatAt: now, leaseExpiresAt: now + 45_000,
  };
  await set(controlRef, active);
  sessionStorage.setItem(`ttscore:poc:judge-session:${roomId}`, JSON.stringify(active));
  startHeartbeat(roomId);
  log('judge_control_acquired', { roomId, controlEpoch: active.controlEpoch });
}

function startHeartbeat(roomId) {
  clearInterval(heartbeatTimer);
  heartbeatTimer = setInterval(() => renewControl(roomId).catch((error) => log('heartbeat_error', { roomId, error: safeError(error) })), 20_000);
}

async function renewControl(roomId) {
  if (!online) return;
  const controlRef = ref(db, `/teamRooms/${roomId}/control`);
  const control = (await get(controlRef)).val();
  if (control?.state !== 'active' || control.activeJudgeUid !== user.uid) throw new Error('not_active_judge');
  const now = Date.now();
  await set(controlRef, { ...control, heartbeatAt: now, leaseExpiresAt: now + 45_000 });
}

async function renderJudgeMatch(roomId, assignment) {
  let state = await idbGet(`judge:match:${roomId}:${assignment.individualMeetingId}`);
  if (!state) {
    state = createMatchState({ leftPlayer: assignment.leftPlayer, rightPlayer: assignment.rightPlayer, firstServerSide: 'left' });
    await idbPut(`judge:match:${roomId}:${assignment.individualMeetingId}`, state);
  }
  const node = document.querySelector('#judgeMatch');
  if (!node) return;
  node.innerHTML = `<h2>Личная встреча ${assignment.positionNumber}</h2><div class="scoreboard"><div class="player"><div class="games">${state.gamesBeforeDisplayedLeft}</div><div class="points">${state.pointsLeft}</div><div><div class="server ${state.serverSide === 'left' ? 'on' : ''}"></div><strong>${escapeHtml(state.leftPlayer.familyName)}</strong></div></div><div class="player"><div class="games">${state.gamesBeforeDisplayedRight}</div><div class="points">${state.pointsRight}</div><div><div class="server ${state.serverSide === 'right' ? 'on' : ''}"></div><strong>${escapeHtml(state.rightPlayer.familyName)}</strong></div></div></div><p>Партия ${state.displayedGameNumber} · ${escapeHtml(state.status)}</p><div class="actions" id="scoreActions"></div>`;
  const actions = document.querySelector('#scoreActions');
  if (['ready', 'in_progress'].includes(state.status)) {
    actions.append(button(`Очко: ${state.leftPlayer.familyName}`, () => changeScore(roomId, assignment, 'left')));
    actions.append(button(`Очко: ${state.rightPlayer.familyName}`, () => changeScore(roomId, assignment, 'right')));
  }
  if (state.undoStack.length && !['pending_confirmation', 'finished'].includes(state.status)) actions.append(button('Undo', () => undoScore(roomId, assignment), 'secondary'));
  if (state.status === 'game_finished') actions.append(button('Следующая партия', () => nextGame(roomId, assignment)));
  if (state.status === 'finished') actions.append(button('Отправить финальный результат', () => submitFinalResult(roomId, assignment)));
  if (state.status === 'pending_confirmation') actions.append(button('Повторить отправку без изменения данных', () => submitFinalResult(roomId, assignment), 'secondary'));
}

async function activeControl(roomId) {
  if (!online) {
    const cached = JSON.parse(sessionStorage.getItem(`ttscore:poc:judge-session:${roomId}`) || 'null');
    if (!cached || cached.activeJudgeUid !== user.uid) throw new Error('confirmed_active_control_required');
    return cached;
  }
  const control = (await get(ref(db, `/teamRooms/${roomId}/control`))).val();
  if (!control || control.activeJudgeUid !== user.uid || control.leaseExpiresAt <= Date.now()) throw new Error('active_control_required');
  sessionStorage.setItem(`ttscore:poc:judge-session:${roomId}`, JSON.stringify(control));
  return control;
}

async function flushJudgeOutbox(roomId) {
  if (!online || !user) return;
  await activeControl(roomId);
  const stateEnvelope = await idbGet(`judge:state-outbox:${roomId}`);
  if (stateEnvelope) {
    await set(ref(db, `/teamRooms/${roomId}/public/individualState`), stateEnvelope);
    await idbPut(`judge:state-outbox:${roomId}`, null);
    log('individual_state_outbox_flushed', { roomId, stateRevision: stateEnvelope.stateRevision });
  }
  const pending = await idbGet(`judge:final-pending:${roomId}`);
  if (pending) {
    await set(ref(db, `/teamRooms/${roomId}/inbox/${pending.meetingId}`), pending.envelope);
    await idbPut(`judge:final-pending:${roomId}`, null);
    log('final_result_outbox_flushed', { roomId, meetingId: pending.meetingId });
  }
}

async function changeScore(roomId, assignment, side) {
  let state = await idbGet(`judge:match:${roomId}:${assignment.individualMeetingId}`);
  state = addPoint(state, side);
  await idbPut(`judge:match:${roomId}:${assignment.individualMeetingId}`, state);
  await publishIndividualState(roomId, assignment, state);
  await renderJudgeMatch(roomId, assignment);
}

async function undoScore(roomId, assignment) {
  let state = await idbGet(`judge:match:${roomId}:${assignment.individualMeetingId}`);
  state = undo(state);
  await idbPut(`judge:match:${roomId}:${assignment.individualMeetingId}`, state);
  await publishIndividualState(roomId, assignment, state);
  await renderJudgeMatch(roomId, assignment);
}

async function nextGame(roomId, assignment) {
  let state = await idbGet(`judge:match:${roomId}:${assignment.individualMeetingId}`);
  state = startNextGame(state);
  await idbPut(`judge:match:${roomId}:${assignment.individualMeetingId}`, state);
  await publishIndividualState(roomId, assignment, state);
  await renderJudgeMatch(roomId, assignment);
}

async function publishIndividualState(roomId, assignment, state) {
  const control = await activeControl(roomId);
  const key = sessionStorage.getItem(`ttscore:poc:public-key:${roomId}`);
  if (!key) throw new Error('public_view_key_missing');
  const payload = {
    schemaVersion: 1, projectionProtocolVersion: 1, roomId,
    individualMeetingId: assignment.individualMeetingId,
    assignmentRevision: assignment.assignmentRevision,
    controlEpoch: control.controlEpoch, activeSessionId: control.activeSessionId,
    stateRevision: state.recordRevision, displayedGameNumber: state.displayedGameNumber,
    leftPlayerFamilyName: state.leftPlayer.familyName,
    rightPlayerFamilyName: state.rightPlayer.familyName,
    pointsLeft: state.pointsLeft, pointsRight: state.pointsRight,
    gamesBeforeDisplayedLeft: state.gamesBeforeDisplayedLeft,
    gamesBeforeDisplayedRight: state.gamesBeforeDisplayedRight,
    serverSide: state.serverSide, status: state.status,
    lastActionId: state.lastActionId, lastActionAt: state.lastActionAt,
  };
  const envelope = await encryptedEnvelope('individualState', key, payload, state.recordRevision, control.controlEpoch, {
    schemaVersion: 1, projectionProtocolVersion: 1,
    individualMeetingId: assignment.individualMeetingId,
    assignmentRevision: assignment.assignmentRevision,
    controlEpoch: control.controlEpoch, activeSessionId: control.activeSessionId,
    stateRevision: state.recordRevision,
  });
  await idbPut(`judge:state-outbox:${roomId}`, envelope);
  if (online) {
    await set(ref(db, `/teamRooms/${roomId}/public/individualState`), envelope);
    await idbPut(`judge:state-outbox:${roomId}`, null);
  }
  log('individual_state_local', { roomId, stateRevision: state.recordRevision, online });
}

async function submitFinalResult(roomId, assignment) {
  const state = await idbGet(`judge:match:${roomId}:${assignment.individualMeetingId}`);
  if (!['finished', 'pending_confirmation'].includes(state.status)) throw new Error('match_not_finished');
  const control = await activeControl(roomId);
  const outboxKey = `judge:final-outbox:${roomId}:${assignment.individualMeetingId}`;
  let envelope = await idbGet(outboxKey);
  if (!envelope) {
    if (state.status !== 'finished') throw new Error('final_outbox_not_found');
    const [finalGamesLeft, finalGamesRight] = gamesIncludingDisplayed(state);
    const winnerSide = finalGamesLeft === 3 ? 'left' : 'right';
    const submissionId = randomId(12);
    const report = {
      individualMeetingId: assignment.individualMeetingId,
      positionNumber: assignment.positionNumber,
      leftPlayer: assignment.leftPlayer, rightPlayer: assignment.rightPlayer,
      rules: makeRules(), handicap: makeHandicap(),
      completedGames: state.completedGames, winnerSide,
      startedAt: state.startedAt, finishedAt: Date.now(),
    };
    const payload = {
      schemaVersion: 1, roomId, teamMeetingId: assignment.teamMeetingId,
      individualMeetingId: assignment.individualMeetingId,
      assignmentRevision: assignment.assignmentRevision,
      submissionId, supersedesSubmissionId: null,
      controlEpoch: control.controlEpoch, activeSessionId: control.activeSessionId,
      recordRevision: state.recordRevision, positionNumber: assignment.positionNumber,
      leftPlayer: assignment.leftPlayer, rightPlayer: assignment.rightPlayer,
      completedGames: state.completedGames, winnerSide,
      finalGamesLeft, finalGamesRight, resultStatus: 'finished',
      individualReportData: report, createdAt: Date.now(),
    };
    envelope = await encryptedEnvelope('pendingFinalResult', readFragmentKey(roomId), payload, state.recordRevision, control.controlEpoch, {
      schemaVersion: 1, submissionId,
      assignmentRevision: assignment.assignmentRevision,
      controlEpoch: control.controlEpoch, activeSessionId: control.activeSessionId,
      recordRevision: state.recordRevision, submittedBy: user.uid,
      status: 'pending', submittedAt: Date.now(),
    });
    delete envelope.updatedAt;
    await idbPut(outboxKey, envelope);
  }
  await idbPut(`judge:final-pending:${roomId}`, { meetingId: assignment.individualMeetingId, envelope });
  if (online) {
    await set(ref(db, `/teamRooms/${roomId}/inbox/${assignment.individualMeetingId}`), envelope);
    await idbPut(`judge:final-pending:${roomId}`, null);
  }
  if (state.status === 'finished') {
    const pendingState = { ...state, status: 'pending_confirmation', serverSide: null, recordRevision: state.recordRevision + 1, lastActionId: randomId(12), lastActionAt: Date.now() };
    await idbPut(`judge:match:${roomId}:${assignment.individualMeetingId}`, pendingState);
    await publishIndividualState(roomId, assignment, pendingState);
    await renderJudgeMatch(roomId, assignment);
  }
  log('final_result_submitted', { roomId, meetingId: assignment.individualMeetingId });
}

async function renderViewer() {
  roleLabel.textContent = 'Роль: зритель';
  if (!roomFromUrl) return show('<section class="card error"><h1>Нет roomId</h1></section>');
  let key;
  try { key = readFragmentKey(roomFromUrl); } catch (error) { return show(`<section class="card error"><h1>Неверный ключ ссылки</h1><p>${safeError(error)}</p></section>`); }
  if (!key) return show('<section class="card error"><h1>Ключ зрительской ссылки не найден</h1></section>');
  show(`<section class="card"><div class="banner" data-network></div><div class="viewer-tabs"><button id="tabScore" type="button">Табло</button><button id="tabReport" class="secondary" type="button">Командный отчёт</button></div><div id="viewerBody"><p class="muted">Подключение…</p></div></section>`);
  const model = { meta: null, teamEnvelope: null, team: null, stateEnvelope: null, state: null, tab: 'score' };
  document.querySelector('#tabScore').addEventListener('click', () => { model.tab = 'score'; renderViewerModel(model); });
  document.querySelector('#tabReport').addEventListener('click', () => { model.tab = 'report'; renderViewerModel(model); });
  clearSubscriptions();
  unsubscribers.push(onValue(ref(db, `/teamRooms/${roomFromUrl}/public/meta`), (snapshot) => {
    model.meta = snapshot.val(); renderViewerModel(model);
  }, (error) => viewerError(error)));
  unsubscribers.push(onValue(ref(db, `/teamRooms/${roomFromUrl}/public/teamProjection`), async (snapshot) => {
    model.teamEnvelope = snapshot.val();
    if (!model.teamEnvelope) return renderViewerModel(model);
    try {
      const aad = aadString({ roomId: roomFromUrl, payloadType: 'teamProjection', primaryRevision: model.teamEnvelope.teamRevision, securityEpoch: model.teamEnvelope.adminEpoch });
      model.team = validatePayload('teamProjection', await decryptJson(key, model.teamEnvelope, aad));
    } catch (error) { log('viewer_team_decrypt_error', { roomId: roomFromUrl, error: safeError(error) }); model.team = null; }
    renderViewerModel(model);
  }, (error) => viewerError(error)));
  unsubscribers.push(onValue(ref(db, `/teamRooms/${roomFromUrl}/public/individualState`), async (snapshot) => {
    model.stateEnvelope = snapshot.val();
    if (!model.stateEnvelope) { model.state = null; return renderViewerModel(model); }
    try {
      const aad = aadString({ roomId: roomFromUrl, payloadType: 'individualState', primaryRevision: model.stateEnvelope.stateRevision, securityEpoch: model.stateEnvelope.controlEpoch });
      model.state = validatePayload('individualState', await decryptJson(key, model.stateEnvelope, aad));
    } catch (error) { log('viewer_state_decrypt_error', { roomId: roomFromUrl, error: safeError(error) }); model.state = null; }
    renderViewerModel(model);
  }, (error) => viewerError(error)));
}

function viewerError(error) {
  log('viewer_listener_error', { roomId: roomFromUrl, error: safeError(error) });
  const body = document.querySelector('#viewerBody');
  if (body) body.innerHTML = `<p class="error">Live-отчёт недоступен: ${escapeHtml(safeError(error))}</p>`;
}

function renderViewerModel(model) {
  const body = document.querySelector('#viewerBody');
  if (!body) return;
  if (!model.meta) { body.innerHTML = '<p class="muted">Live-отчёт не найден или срок ссылки истёк.</p>'; return; }
  if (!model.team) { body.innerHTML = '<p class="muted">Ожидание командной проекции…</p>'; return; }
  if (model.tab === 'report') {
    const rows = model.team.positions.map((position) => `<div class="position"><strong>№ ${position.positionNumber}: ${escapeHtml(position.leftPlayer?.familyName || '—')} — ${escapeHtml(position.rightPlayer?.familyName || '—')}</strong><span>${escapeHtml(position.status)}${position.finalGamesLeft == null ? '' : ` · ${position.finalGamesLeft}:${position.finalGamesRight}`}</span></div>`).join('');
    body.innerHTML = `<h1>${escapeHtml(model.team.leftTeam.name)} ${model.team.teamScoreLeft}:${model.team.teamScoreRight} ${escapeHtml(model.team.rightTeam.name)}</h1>${rows}`;
    return;
  }
  if (!compatibleProjectionPair(model.teamEnvelope, model.stateEnvelope) || !model.state) {
    body.innerHTML = `<h1>${escapeHtml(model.team.leftTeam.name)} ${model.team.teamScoreLeft}:${model.team.teamScoreRight} ${escapeHtml(model.team.rightTeam.name)}</h1><p class="muted">${model.team.publicStatus === 'finished' ? 'Командная встреча завершена' : 'Подготовка следующей личной встречи'}</p>`;
    return;
  }
  const state = model.state;
  body.innerHTML = `<div class="scoreboard"><div class="player"><div class="games">${state.gamesBeforeDisplayedLeft}</div><div class="points">${state.pointsLeft}</div><div><div class="server ${state.serverSide === 'left' ? 'on' : ''}"></div><strong>${escapeHtml(state.leftPlayerFamilyName)}</strong></div></div><div class="player"><div class="games">${state.gamesBeforeDisplayedRight}</div><div class="points">${state.pointsRight}</div><div><div class="server ${state.serverSide === 'right' ? 'on' : ''}"></div><strong>${escapeHtml(state.rightPlayerFamilyName)}</strong></div></div></div><p>${escapeHtml(model.team.leftTeam.name)} ${model.team.teamScoreLeft}:${model.team.teamScoreRight} ${escapeHtml(model.team.rightTeam.name)} · партия ${state.displayedGameNumber}</p>`;
}

onAuthStateChanged(auth, async (nextUser) => {
  user = nextUser;
  log('auth_state', { signedIn: Boolean(user), uid: user?.uid || null });
  if (mode === 'team-admin') await renderAdminHome();
  else if (mode === 'team-judge') await renderJudge();
});

if (mode === 'team-live') renderViewer();
else if (!['team-admin', 'team-judge'].includes(mode)) show('<section class="card error"><h1>Неизвестный режим</h1></section>');

window.addEventListener('beforeunload', () => {
  clearSubscriptions();
  clearInterval(heartbeatTimer);
});
</script>
</body>
</html>
